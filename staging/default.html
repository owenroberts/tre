<!-- 
	most basic three js default scene to copy for other staging examples
 -->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>tre ~ default three js example</title>
	<style>
		body { margin: 0; }
	</style>
</head>
<body>
	
<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { getDefaultScene } from '../src/staging/getDefaultScene.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 1000 );
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer();
renderer.setSize( window.innerWidth, window.innerHeight );
document.body.appendChild( renderer.domElement );
const controls = new OrbitControls( camera, renderer.domElement );

getDefaultScene(scene);

function animate() {
  renderer.render( scene, camera );
  scene.cube.rotation.x += 0.01;
  scene.cube.rotation.y += 0.01;
}
renderer.setAnimationLoop( animate );

</script>
</body>
</html>
