<!-- 
	most basic three js default scene to copy for other staging examples
 -->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>tre ~ default three js example</title>
	<style>
		body { margin: 0; }
	</style>
</head>
<body>
	
<script type="module">

import * as THREE from 'three';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';


import { BandShader } from '../src/BandShader.js';

import { getDefaultScene } from '../src/staging/getDefaultScene.js';

const sceneData = {
	debug: false,
};

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 1000 );
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer();
renderer.setSize( window.innerWidth, window.innerHeight );
document.body.appendChild( renderer.domElement );
const controls = new OrbitControls( camera, renderer.domElement );

getDefaultScene(scene);

const sky = new Sky();
const sun = new THREE.Vector3();
sky.scale.setScalar(10);
scene.add(sky);
const phi = THREE.MathUtils.degToRad(15);
const theta = THREE.MathUtils.degToRad(15);
sun.setFromSphericalCoords( 1, phi, theta );
sky.material.uniforms['sunPosition'].value.copy(sun);
sky.material.uniforms['turbidity'].value = 0.5;
sky.material.uniforms['rayleigh'].value = 0.25;

const bandData = {
	bandSize: 16,
	noiseBlend: 56 / 255,
};

const skyPass = new RenderPass(scene, camera);
const bandEffect = new ShaderPass(BandShader);

const outputPass = new OutputPass();
const composer = new EffectComposer(renderer);
composer.renderToScreen = true;
composer.addPass(skyPass);
// composer.addPass(renderPixelatedPass);
composer.addPass(bandEffect);
composer.addPass(outputPass);

// set up lil-gui
const gui = new GUI();
const sceneGUI = gui.addFolder("Scene");
sceneGUI.add(sceneData, 'debug');

const bandFolder = gui.addFolder("Band Effect");
bandFolder.add(bandData, 'bandSize', 1, 64).onChange(value => {
	bandEffect.uniforms.bandSize.value = value;
});

bandFolder.add(bandData, 'noiseBlend', 0.0, 1.0).onChange(value => {
	bandEffect.uniforms.noiseBlend.value = value;
});

function animate() {
	if (sceneData.debug) renderer.render(scene, camera);
	else composer.render();

	scene.cube.rotation.x += 0.01;
	scene.cube.rotation.y += 0.01;
}
renderer.setAnimationLoop( animate );

</script>
</body>
</html>
