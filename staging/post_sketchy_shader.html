<!-- 
	same as post_sketchy, with only shader no render pass
 -->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>tre ~ default three js example</title>
	<style>
		body { 
			margin: 0; 
			background: black;
		}
	</style>
</head>
<body>
	
<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

// render stuff
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/examples/jsm/postprocessing/RenderPass';
import { ShaderPass } from 'three/examples/jsm/postprocessing/ShaderPass.js';


// my lines pass
import { LinesMaterial } from '../src/LinesMaterial.js';
import noiseTexture from '../src/images/image-7.png';

const sceneData = {
	debug: false,
};

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 1000 );
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer();
renderer.setSize( window.innerWidth, window.innerHeight );
// renderer.setClearColor('#eee');
renderer.physicallyCorrectLights = true;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.CineonToneMapping;
renderer.toneMappingExposure = 1.75;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild( renderer.domElement );

const controls = new OrbitControls( camera, renderer.domElement );

const geometry = new THREE.BoxGeometry( 1, 1, 1 );
const material = new THREE.MeshBasicMaterial( { color: 0x00ff00 } );
const cube = new THREE.Mesh( geometry, material );
cube.castShadow = true;
scene.add( cube );

function addSphere() {
	const geometry = new THREE.SphereGeometry( 1, 32, 16 ); 
	const material = new THREE.MeshBasicMaterial( { color: 0xffff00 } ); 
	const sphere = new THREE.Mesh( geometry, material ); 
	sphere.castShadow = true;
	sphere.position.set(2, 0, 0);
	scene.add( sphere );
}
addSphere();

function addTorus() {
	const geometry = new THREE.TorusKnotGeometry(.5, 0.2, 200, 32);
	const material = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
	const torus = new THREE.Mesh(geometry, material);
	torus.castShadow = true;
	torus.rotation.y = Math.PI / 4;
	torus.position.set(-2, 0, 0);
	scene.add(torus);
}
addTorus();

function addPlane() {
	const plane = new THREE.Mesh(
		new THREE.PlaneGeometry(10, 10),
		new THREE.MeshStandardMaterial({ color: 0xffffff })
	);
	plane.rotation.x = -Math.PI / 2;
	plane.position.y = -1;
	plane.receiveShadow = true;
	scene.add(plane);
}
addPlane();

function addLight() {
	const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
	directionalLight.castShadow = true;
	directionalLight.position.set(2, 2, 2);
	directionalLight.shadow.mapSize.width = 2048;
	directionalLight.shadow.mapSize.height = 2048;
	scene.add(directionalLight);

	const hemisphereLight = new THREE.HemisphereLight(0x7a3114, 0x48c3ff, 0.5);
	scene.add(hemisphereLight);
}
addLight();

// setup post processor
const linesPassData = {
	lineColor: 0x000000,
	bgColor: 0xC7C7C7,
	bgAlpha: 0.0,
	diffuseCutoff: 40,
	normalCutoff: 50,
	noiseMultiplier: 10,
	diffuseNoiseOffset: 0.0,
	normalNoiseOffset: 0.0,
};

const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera); // need render pass for shadows, diffuse cutoff
composer.addPass(renderPass);

const linesMaterial = new LinesMaterial({ uniforms: linesPassData });
const loader = new THREE.TextureLoader();
loader.load(noiseTexture, texture => {
	linesMaterial.uniforms.uTexture.value = texture;
});


const linesPass = new ShaderPass( linesMaterial );
composer.addPass( linesPass );



// set up lil-gui
const gui = new GUI();

const sceneGUI = gui.addFolder("Scene");

sceneGUI.add(sceneData, 'debug');

const shader = gui.addFolder( "Shader Uniforms" );
// folder.close();

// https://discourse.threejs.org/t/setting-color-in-3js-code-vs-what-lil-gui-uses/67907/2
shader.addColor(linesPassData, 'lineColor').onChange(value => {
	linesPass.material.uniforms.lineColor.value = new THREE.Color().setHex(value, THREE.SRGBColorSpace);
});

shader.addColor(linesPassData, 'bgColor').onChange(value => {
	linesPass.material.uniforms.bgColor.value = new THREE.Color().setHex(value, THREE.SRGBColorSpace);
});

shader.add(linesPassData, 'bgAlpha', 0, 1).onChange(value => {
	linesPass.material.uniforms.bgAlpha.value = value;
});

shader.add(linesPassData, 'diffuseCutoff', 0.001, 60.000).onChange(value => {
	linesPass.material.uniforms.diffuseCutoff.value = value;
});

shader.add(linesPassData, 'normalCutoff', 0.1, 100.0).onChange(value => {
	linesPass.material.uniforms.normalCutoff.value = value;
});

shader.add(linesPassData, 'noiseMultiplier', 0.1, 100.0).onChange(value => {
	linesPass.material.uniforms.noiseMultiplier.value = value;
});

function animate() {
	if (sceneData.debug) renderer.render(scene, camera);
	else composer.render();

	cube.rotation.x += 0.01;
	cube.rotation.y += 0.01;
}
renderer.setAnimationLoop( animate );

</script>
</body>
</html>
