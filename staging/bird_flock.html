<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>tre ~ bird flock</title>
	<style>
		body { margin: 0; }
	</style>
</head>
<body>

<script type="module">

import * as THREE from 'three';
import { random } from "../../cool/cool.js";
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

import { Bird, Flock, Follower } from '../src/tre.js';
import { SceneBuilder } from '../src/staging/SceneBuilder.js';
import { setupPostProcessing } from '../src/staging/setupPostProcessing';

const sceneData = {
	debug: false,
	sketchy: true,
};

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 1000 );
camera.position.y = 10;
camera.position.z = 20;
camera.lookAt(new THREE.Vector3(0, 0, 0));

const renderer = new THREE.WebGLRenderer();
renderer.setSize( window.innerWidth, window.innerHeight );
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild( renderer.domElement );

const controls = new OrbitControls( camera, renderer.domElement );

const builder = new SceneBuilder(scene);
builder.addGround();
builder.addLights();

const gui = new GUI();
const sceneGUI = gui.addFolder("Scene");
sceneGUI.add(sceneData, 'debug');
sceneGUI.add(sceneData, 'sketchy');
sceneGUI.close();

const composer = setupPostProcessing({ scene, camera, renderer, gui });

// add flock positions
const flockTargets = [
	builder.addSphere({ x: 10, y: 5, z: -10 }), 
	builder.addSphere({ x: -10, y:  10, z: -10 }), 
	builder.addSphere({ x: -10, y:  5, z: 10 }), 
];

// add flock
const flock = new Flock({ type: Bird });
flock.members.forEach(m => scene.add(m.obj)); // automate this ...
flock.setup(flockTargets[0], flockTargets[1]);

const b = flock.members[0].member;
const flockData = {
	speed: b.speed,
	radius: b.flocking.radius,
	align: b.flocking.align,
	center: b.flocking.center,
	separation: b.flocking.separation,
	seek: b.flocking.seek,
};
const flockFolder = gui.addFolder('Flock');
flockFolder.add(flockData, 'speed', 0, 1).onChange(value => {
	flock.members.forEach(m => { m.speed = value; });
});

let prevTime;
function animate(time) {
	if (!prevTime) prevTime = time;
	const timeElapsed = time - prevTime;
	prevTime = time;
	const timeElapsedInSeconds = timeElapsed / 1000;

	if (sceneData.sketchy) composer.render();
	else renderer.render(scene, camera);

	flock.update(timeElapsedInSeconds);
	if (flock.reachedTarget) {
		// flock.target = flockTargets[2];
	}


}
renderer.setAnimationLoop( animate );

</script>
</body>
</html>
