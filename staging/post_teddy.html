<!-- 
	example of sketchy pencil effect
	https://tympanus.net/codrops/2022/11/29/sketchy-pencil-effect-with-three-js-post-processing/
 -->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>tre ~ default three js example</title>
	<style>
		body { 
			margin: 0; 
			background: black;
		}
	</style>
</head>
<body>
	
<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

// render stuff
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/examples/jsm/postprocessing/RenderPass';

// teddy pass
import { TeddyPass } from '../src/TeddyPass.js';

const sceneData = {
	debug: false,
};

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 1000 );
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer();
renderer.setSize( window.innerWidth, window.innerHeight );
// renderer.setClearColor('#eee');
renderer.physicallyCorrectLights = true;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.CineonToneMapping;
renderer.toneMappingExposure = 1.75;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild( renderer.domElement );

const controls = new OrbitControls( camera, renderer.domElement );

const geometry = new THREE.BoxGeometry( 1, 1, 1 );
const material = new THREE.MeshBasicMaterial( { color: 0x00ff00 } );
const cube = new THREE.Mesh( geometry, material );
cube.castShadow = true;
scene.add( cube );

function addSphere() {
	const geometry = new THREE.SphereGeometry( 1, 32, 16 ); 
	const material = new THREE.MeshBasicMaterial( { color: 0xffff00 } ); 
	const sphere = new THREE.Mesh( geometry, material ); 
	sphere.castShadow = true;
	sphere.position.set(2, 0, 0);
	scene.add( sphere );
}
addSphere();

function addTorus() {
	const geometry = new THREE.TorusKnotGeometry(.5, 0.2, 200, 32);
	const material = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
	const torus = new THREE.Mesh(geometry, material);
	torus.castShadow = true;
	torus.rotation.y = Math.PI / 4;
	torus.position.set(-2, 0, 0);
	scene.add(torus);
}
addTorus();

function addPlane() {
	const plane = new THREE.Mesh(
		new THREE.PlaneGeometry(10, 10),
		new THREE.MeshStandardMaterial({ color: 0xffffff })
	);
	plane.rotation.x = -Math.PI / 2;
	plane.position.y = -1;
	plane.receiveShadow = true;
	scene.add(plane);
}
addPlane();

function addLight() {
	const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
	directionalLight.castShadow = true;
	directionalLight.position.set(2, 2, 2);
	directionalLight.shadow.mapSize.width = 2048;
	directionalLight.shadow.mapSize.height = 2048;
	scene.add(directionalLight);

	const hemisphereLight = new THREE.HemisphereLight(0x7a3114, 0x48c3ff, 0.5);
	scene.add(hemisphereLight);
}
addLight();

// setup post processor
const teddyPassData = {
	lineColor: 0x000000,
	bgColor: 0xC7C7C7,
	bgAlpha: 0.0,
	diffuseCutoff: 40,
	normalCutoff: 50,
	noiseMultiplier: 10,
	diffuseNoiseOffset: 0.0,
	normalNoiseOffset: 0.0,
};

const teddyPass = new TeddyPass({
	scene, 
	camera,
	width: renderer.domElement.clientWidth, 
	height: renderer.domElement.clientHeight, 
	uniforms: {
		lineColor: { type: 'vec3', value: new THREE.Color(teddyPassData.lineColor) },
		bgColor: { type: 'vec3', value: new THREE.Color(teddyPassData.bgColor) },
		bgAlpha: { type: 'float', value: teddyPassData.bgAlpha },
		diffuseCutoff: { type: 'float', value: teddyPassData.diffuseCutoff },
		normalCutoff: { type: 'float', value: teddyPassData.normalCutoff },
		noiseMultiplier: { type: 'float', value: teddyPassData.noiseMultiplier },
	}
});

const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera); // need render pass for shadows, diffuse cutoff
composer.addPass(renderPass);
composer.addPass(teddyPass);

// set up lil-gui
const gui = new GUI();
const sceneGUI = gui.addFolder("Scene");
sceneGUI.add(sceneData, 'debug');

// const shader = gui.addFolder( "Shader Uniforms" );
// folder.close();

// shader.addColor(teddyPassData, 'lineColor').onChange(value => {
// 	teddyPass.material.uniforms.lineColor.value = new THREE.Color().setHex(value, THREE.SRGBColorSpace);
// });

function animate() {
	if (sceneData.debug) renderer.render(scene, camera);
	else composer.render();

	cube.rotation.x += 0.01;
	cube.rotation.y += 0.01;
}
renderer.setAnimationLoop( animate );

</script>
</body>
</html>
