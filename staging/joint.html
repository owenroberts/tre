<!-- 
	idea of joint is a build block for procedurally generated and animated flora and fauna
	makes positioning and rotating around points easier
	won't prob make that much sense without animation but one step at a time...
 	this example demonstrates basically just a "head" with a top and a bottom
 -->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>tre ~ default three js example</title>
	<style>
		body { margin: 0; }
	</style>
</head>
<body>
	
<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

import { SceneBuilder } from '../src/staging/SceneBuilder.js';

import { Joint } from '../src/Joint.js';

const sceneData = {
	debug: false,
};

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 1000 );
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer();
renderer.setSize( window.innerWidth, window.innerHeight );
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild( renderer.domElement );

const controls = new OrbitControls( camera, renderer.domElement );

const builder = new SceneBuilder(scene);
builder.addGround();
builder.addLights();

const mainJoint = {
	position: { x: 0, y: 0.2, z: 0 },
	rotation: { x: 0, y: 0, z: 0 },
};

const bottomJoint = {
	position: { x: 0, y: 0, z: 0 },
	rotation: { x: 0, y: 0, z: 0 },
};

const j = new Joint();
j.debug(scene);
j.setPosition(mainJoint.position.x, mainJoint.position.y, mainJoint.position.z);
scene.add(j.obj);

const top = builder.addCube();
top.position.set(0, 0.5, 0.5);
j.add(top);


const bottom = new Joint();
const m = builder.addCube();
bottom.add(m);
m.position.set(0, -0.5, 0.5);
bottom.rotateX(Math.PI * 0.1);
j.add(bottom);

const gui = new GUI();
const sceneGUI = gui.addFolder("Scene");
sceneGUI.close();
sceneGUI.add(sceneData, 'debug');

const jfm = gui.addFolder( "Main Joint" );

jfm.add(mainJoint.position, 'x', -10, 10)
	.name('position x')
	.onChange(value => {
		j.obj.position.x = value;
	});

jfm.add(mainJoint.position, 'y', -10, 10)
	.name('position y')
	.onChange(value => {
		j.obj.position.y = value;
	});

jfm.add(mainJoint.position, 'z', -10, 10)
	.name('position z').onChange(value => {
		j.obj.position.z = value;
	});

jfm.add(mainJoint.rotation, 'x', -Math.PI, Math.PI)
	.name('rotation x')
	.onChange(value => {
		j.obj.rotation.x = value;
	});

jfm.add(mainJoint.rotation, 'y', -Math.PI, Math.PI)
	.name('rotation y')
	.onChange(value => {
		j.obj.rotation.y = value;
	});

jfm.add(mainJoint.rotation, 'z', -Math.PI, Math.PI)
	.name('rotation z')
	.onChange(value => {
		j.obj.rotation.z = value;
	});

const jfb = gui.addFolder( "Bottom Joint" );

jfb.add(bottomJoint.position, 'x', -10, 10)
	.name('position x')
	.onChange(value => {
		bottom.obj.position.x = value;
	});

jfb.add(bottomJoint.position, 'y', -10, 10)
	.name('position y')
	.onChange(value => {
		bottom.obj.position.y = value;
	});

jfb.add(bottomJoint.position, 'z', -10, 10)
	.name('position z').onChange(value => {
		bottom.obj.position.z = value;
	});

jfb.add(bottomJoint.rotation, 'x', -Math.PI, Math.PI)
	.name('rotation x')
	.onChange(value => {
		bottom.obj.rotation.x = value;
	});

jfb.add(bottomJoint.rotation, 'y', -Math.PI, Math.PI)
	.name('rotation y')
	.onChange(value => {
		bottom.obj.rotation.y = value;
	});

jfb.add(bottomJoint.rotation, 'z', -Math.PI, Math.PI)
	.name('rotation z')
	.onChange(value => {
		bottom.obj.rotation.z = value;
	});


let prevTime;
function animate(time) {
	if (!prevTime) prevTime = time;
	const timeElapsed = time - prevTime;
	prevTime = time;
	const timeElapsedInSeconds = timeElapsed / 1000;

	renderer.render( scene, camera );
 	// cube.rotation.x += 0.01;
	// cube.rotation.y += 0.01;
}
renderer.setAnimationLoop( animate );

</script>
</body>
</html>
